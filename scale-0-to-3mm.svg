    </pattern>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#182428"/>
      <stop offset="1" stop-color="#111b1f"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="180" rx="8" fill="url(#bg)"/>
  <rect width="1200" height="180" rx="8" fill="url(#diagonal)"/>

