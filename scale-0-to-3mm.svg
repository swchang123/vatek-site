<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="180" viewBox="0 0 1200 180" role="img" aria-labelledby="title desc">
  <title id="title">0.0~3.0 mm 눈금자</title>
  <desc id="desc">0.1 mm 간격으로 표시된 가로형 눈금자</desc>
  <defs>
    <pattern id="diagonal" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
